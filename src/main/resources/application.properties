spring.main.web-application-type=none
spring.redis.host=${EXAMPLE_REDIS_HOST:localhost}
spring.redis.port=${EXAMPLE_REDIS_PORT:6379}
example.token-url=${EXAMPLE_TOKEN_URL:http://localhost:9090/token}
example.client-id=${EXAMPLE_CLIENT_ID:sample-client}
example.client-secret=${EXAMPLE_CLIENT_SECRET:sample-secret}
example.cache-key=${EXAMPLE_CACHE_KEY:example:access-token}
example.token-ttl-seconds=${EXAMPLE_TOKEN_TTL_SECONDS:60}
